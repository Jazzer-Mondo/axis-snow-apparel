<!DOCTYPE html>
<html>
<head>
  <title>Axis Snow Apparel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav>
    <h1>Axis Snow Apparel</h1>
    <button onclick="showLogin()">Login</button>
  </nav>

  <header class="hero">
    <h2>Ride the Line ❄️</h2>
    <p>Park skiing culture meets apparel design</p>
  </header>

  <section class="content">
    <h3>Latest Drop</h3>
    <p id="post">Welcome to Axis Snow Apparel.</p>
    <button onclick="editPost()">Edit (demo)</button>
  </section>

  <script src="app.js"></script>
</body>
</html>
<section class="ski-art">
  <h2>Axis Style</h2>

  <svg viewBox="0 0 500 200" class="ski-svg">
    
    <!-- Skier 1: Off-axis grab -->
    <g class="skier">
      <circle cx="80" cy="60" r="8" /> <!-- head -->
      <path d="M80 68 L90 90 L70 100 L60 80 Z" /> <!-- body -->
      <path d="M70 100 L50 120" /> <!-- leg -->
      <path d="M90 90 L110 70" /> <!-- arm grabbing -->
      <line x1="40" y1="130" x2="120" y2="110" /> <!-- ski -->
    </g>

    <!-- Skier 2: Cork spin style -->
    <g class="skier">
      <circle cx="200" cy="80" r="8" />
      <path d="M200 88 L215 105 L190 115 L180 95 Z" />
      <path d="M190 115 L170 130" />
      <path d="M215 105 L235 85" />
      <line x1="160" y1="140" x2="240" y2="120" />
    </g>

    <!-- Skier 3: Tweak grab -->
    <g class="skier">
      <circle cx="340" cy="60" r="8" />
      <path d="M340 68 L355 90 L330 100 L320 80 Z" />
      <path d="M330 100 L310 120" />
      <path d="M355 90 L375 70" />
      <line x1="300" y1="130" x2="380" y2="110" />
    </g>

  </svg>
</section>
