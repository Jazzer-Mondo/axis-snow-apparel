<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Axis Snow Apparel</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <h1>AXIS</h1>
    <div>
      <a href="#">Home</a>
      <a href="#">Shop</a>
      <a href="#">Login</a>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <h2>Ride Off Axis</h2>
    <p>Premium Freestyle Ski Apparel</p>
    <button>Shop Drop</button>
  </section>

  <!-- SKI VISUAL -->
<!-- =====================================================
     REPLACE ONLY YOUR <svg> ... </svg> SECTION WITH THIS
===================================================== -->

<svg viewBox="0 0 1200 420" class="ski-svg">

  <!-- ===== MUTE CORK ===== -->
  <g class="skier cork cork1">

    <!-- head -->
    <circle cx="180" cy="130" r="10"/>

    <!-- torso -->
    <path d="M180 140 L210 175 L160 190 L145 160 Z"/>

    <!-- grab arm -->
    <path class="arm" d="M210 175 L170 225"/>

    <!-- back arm -->
    <path d="M160 170 L135 145"/>

    <!-- legs -->
    <path d="M160 190 L135 235"/>
    <path d="M190 190 L215 230"/>

    <!-- crossed skis -->
    <line x1="110" y1="250" x2="260" y2="205"/>
    <line x1="255" y1="255" x2="120" y2="200"/>

  </g>

  <!-- ===== BLUNT CORK ===== -->
  <g class="skier cork cork2">

    <circle cx="560" cy="160" r="10"/>

    <path d="M560 170 L595 205 L545 220 L530 185 Z"/>

    <!-- blunt tail grab -->
    <path class="arm" d="M530 185 L485 255"/>

    <!-- other arm -->
    <path d="M595 205 L630 180"/>

    <!-- legs -->
    <path d="M545 220 L520 265"/>
    <path d="M580 220 L620 255"/>

    <!-- skis -->
    <line x1="470" y1="285" x2="690" y2="225"/>

  </g>

  <!-- ===== JAPAN CORK ===== -->
  <g class="skier cork cork3">

    <circle cx="930" cy="135" r="10"/>

    <path d="M930 145 L965 180 L915 195 L900 165 Z"/>

    <!-- japan grab -->
    <path class="arm" d="M965 180 L925 225"/>

    <!-- other arm -->
    <path d="M915 165 L885 145"/>

    <!-- legs -->
    <path d="M915 195 L890 235"/>
    <path d="M950 195 L980 230"/>

    <!-- tight skis -->
    <line x1="860" y1="250" x2="1015" y2="205"/>
    <line x1="865" y1="260" x2="1020" y2="215"/>

  </g>

</svg>
  </section>

  <!-- PRODUCTS -->
  <section class="products">
    <h2>Latest Drop</h2>

    <div class="product-grid">
      <div class="product">
        <h3>Axis Jacket</h3>
        <p>$120</p>
        <button>Add to Cart</button>
      </div>

      <div class="product">
        <h3>Snow Hoodie</h3>
        <p>$65</p>
        <button>Add to Cart</button>
      </div>

      <div class="product">
        <h3>Park Pants</h3>
        <p>$95</p>
        <button>Add to Cart</button>
      </div>
    </div>
  </section>

</body>
</html>
