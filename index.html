<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Axis Snow Apparel</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <h1>AXIS</h1>
    <div>
      <a href="#">Home</a>
      <a href="#">Shop</a>
      <a href="#">Login</a>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <h2>Ride Off Axis</h2>
    <p>Premium Freestyle Ski Apparel</p>
    <button>Shop Drop</button>
  </section>

  <!-- SKI VISUAL -->
  <section class="ski-art">
    <svg viewBox="0 0 500 200" class="ski-svg">
      <g class="skier">
        <circle cx="80" cy="60" r="8"/>
        <path d="M80 68 L90 90 L70 100 L60 80 Z"/>
        <path d="M70 100 L50 120"/>
        <path d="M90 90 L110 70"/>
        <line x1="40" y1="130" x2="120" y2="110"/>
      </g>
      <g class="skier">
        <circle cx="200" cy="80" r="8"/>
        <path d="M200 88 L215 105 L190 115 L180 95 Z"/>
        <path d="M190 115 L170 130"/>
        <path d="M215 105 L235 85"/>
        <line x1="160" y1="140" x2="240" y2="120"/>
      </g>
      <g class="skier">
        <circle cx="340" cy="60" r="8"/>
        <path d="M340 68 L355 90 L330 100 L320 80 Z"/>
        <path d="M330 100 L310 120"/>
        <path d="M355 90 L375 70"/>
        <line x1="300" y1="130" x2="380" y2="110"/>
      </g>
    </svg>
  </section>

  <!-- PRODUCTS -->
  <section class="products">
    <h2>Latest Drop</h2>

    <div class="product-grid">
      <div class="product">
        <h3>Axis Jacket</h3>
        <p>$120</p>
        <button>Add to Cart</button>
      </div>

      <div class="product">
        <h3>Snow Hoodie</h3>
        <p>$65</p>
        <button>Add to Cart</button>
      </div>

      <div class="product">
        <h3>Park Pants</h3>
        <p>$95</p>
        <button>Add to Cart</button>
      </div>
    </div>
  </section>

</body>
</html>
